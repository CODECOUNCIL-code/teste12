name: Render Horror Video
on:
  workflow_dispatch:
    inputs:
      title:
        description: "Video title"
        required: true
        type: string
      script:
        description: "Narration script"
        required: true
        type: string
      background_url:
        description: "Background image URL"
        required: true
        type: string
      thumbnail_text:
        description: "Text overlay"
        required: false
        type: string
        default: "NÃO ABRAS ESTA PORTA"

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ffmpeg \
            python3 \
            python3-pip \
            fonts-dejavu-core \
            libass-dev

      - name: Install Python dependencies
        run: |
          pip3 install pillow requests edge-tts

      - name: Render video
        env:
          VIDEO_TITLE:      ${{ github.event.inputs.title }}
          VIDEO_SCRIPT:     ${{ github.event.inputs.script }}
          BACKGROUND_URL:   ${{ github.event.inputs.background_url }}
          THUMBNAIL_TEXT:   ${{ github.event.inputs.thumbnail_text }}
          # Voz PT-PT
          # pt-PT-DuarteNeural = masculina
          # pt-PT-RaquelNeural = feminina
          EDGE_VOICE:   "pt-PT-DuarteNeural"
          EDGE_RATE:    "-12%"    # mais lento → mais humano
          EDGE_VOLUME:  "+0%"
        run: |
          python3 render_video.py

      - name: Upload video artifact
        uses: actions/upload-artifact@v4
        with:
          name: rendered-horror-video
          path: output/final_video.mp4
          retention-days: 7
