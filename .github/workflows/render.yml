name: Render Horror Video

on:
  workflow_dispatch:
    inputs:
      title:
        description: "Video title"
        required: true
        type: string
      script:
        description: "Narration script"
        required: true
        type: string
      background_url:
        description: "Background image URL"
        required: true
        type: string
      thumbnail_text:
        description: "Text overlay"
        required: false
        type: string
        default: "DO NOT OPEN"

jobs:
  render:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg espeak-ng python3 python3-pip fonts-dejavu-core
          pip3 install pillow requests

      - name: Render video
        env:
          VIDEO_TITLE: ${{ github.event.inputs.title }}
          VIDEO_SCRIPT: ${{ github.event.inputs.script }}
          BACKGROUND_URL: ${{ github.event.inputs.background_url }}
          THUMBNAIL_TEXT: ${{ github.event.inputs.thumbnail_text }}
        run: |
          python3 render_video.py

      - name: Upload video artifact
        uses: actions/upload-artifact@v4
        with:
          name: rendered-horror-video
          path: output/final_video.mp4
